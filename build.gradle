plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'java'
}

group = "de.rthillmann.solarmonitoring.SolarMonitoringApplet"
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
    //enable compilation in a separate daemon process
    // options.fork = true
    //options.compilerArgs = ["-Xlint:deprecation"];
}

java {
    sourceCompatibility = "16"
    targetCompatibility = "17"
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // If using JUnit Jupiter
    // Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation("org.junit.jupiter:junit-jupiter:6.0.2")

    // Source: https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
    testImplementation("org.junit.platform:junit-platform-launcher:6.0.2")

    //
    // Parse JSON-Data
    //
    implementation "com.google.code.gson:gson:2.13.2"
}

test {
    // Enable JUnit 5 (Gradle 4.6+).
    useJUnitPlatform()

    // Always run tests, even when nothing changed.
    dependsOn 'cleanTest'

    // Show test results.
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': 'de.rthillmann.solarmonitoring.SolarMonitoringApplet'
        )
    }
}

tasks.register('runExecutableJar', JavaExec) {
	group = 'SolarmonitoringApplet'
    description = 'Run from jar-file'
    // Executable jars can have only _one_ jar on the classpath.
    classpath = files(tasks.jar)

    // 'main' does not need to be specified

    // arguments to pass to the application
    args = [
            "--name=Garden",
            "http://192.168.178.55",
            // *** sample with all parms given ***
            // "--name=Street",
            // "--refresh=40",
            // "--color=YELLOW",
            //"http://192.168.178.55",
    ]
}

extensions.findByName("buildScan")?.with {

    setProperty("termsOfServiceUrl", "https://gradle.com/terms-of-service")

    setProperty("termsOfServiceAgree", "yes")

}

tasks.build.doFirst {
    println "used jdk path: " + System.getenv('JAVA_HOME')
}
